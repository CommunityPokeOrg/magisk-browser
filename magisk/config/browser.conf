# Wolfy Browser — root configuration
# Consumed once per boot by the module's service.sh. Edit on-device in
# Settings → Root, or directly with any root file editor.
# Documented in docs/ROOT-SETTINGS.md.

# 1 = grant org.communitypoke.magiskbrowser the android.app.role.BROWSER role
#     at every boot (API 29+). 0 = leave the system default alone.
set_default_browser=0

# host:port applied to `settings put global http_proxy` at boot.
# Empty = leave unchanged. (To clear a previously-set value, use ":0".)
global_http_proxy=

# Package name of an installed WebView provider to select at boot via
# `cmd webviewupdate set-webview-implementation`. Empty = leave unchanged.
# WARNING: most production builds restrict this; read docs/LIMITATIONS.md.
webview_provider=

# 1 = generate a systemless /system/etc/hosts overlay from
#     /data/adb/magisk-browser/hosts.block (one domain per line).
hosts_blocklist=0
